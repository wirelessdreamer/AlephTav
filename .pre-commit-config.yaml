repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.5
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: local
    hooks:
      - id: validate-content
        name: validate-content
        entry: python scripts/validate_content.py
        language: system
        pass_filenames: false
      - id: golden-snapshots
        name: golden-snapshots
        entry: python -m pytest tests/golden -q --tb=line
        language: system
        pass_filenames: false
        stages: [pre-push]
